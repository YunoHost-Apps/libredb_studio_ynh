location / {
    proxy_pass http://127.0.0.1:__PORT__;

    include proxy_params;

    # One API route answers as a stream rather than a single body (the AI
    # schema description). Buffering holds that back until it completes, so the
    # panel would sit empty and then fill all at once. The rest of the traffic
    # is dynamic JSON that nginx has no reason to buffer either.
    proxy_buffering off;

    # A query can return a wide result set and an import posts a file; both are
    # larger than the defaults. The timeout is for a statement that takes its
    # time on the engine rather than for a slow client.
    client_max_body_size 100M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
