#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "libredb_studio"
name = "LibreDB Studio"
description.en = "Web SQL client for 16 database engines, with schema browser, ER diagrams and query editor"

version = "0.17.0~ynh1"

maintainers = ["yusuf-gundogdu"]

[upstream]
license = "MIT"
website = "https://libredb.org"
demo = "https://app.libredb.org"
admindoc = "https://libredb.org/helper/"
code = "https://github.com/libredb/libredb-studio"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

ldap = false
sso = false

# Measured on 12.1.41: 292 MB unpacked, 407 MB for the Node tree, 94 MB RSS.
disk = "800M"
ram.build = "50M"
ram.runtime = "250M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    help.en = "LibreDB Studio has its own login system, so YunoHost's SSO can be left off. The first run generates an administrator password and prints it once to the service log."
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/libredb/libredb-studio/releases/download/0.17.0/libredb-studio-standalone-0.17.0-linux-x64.tar.gz"
    amd64.sha256 = "ab64b3c1a8ed00f3e023c5bdafdcbcfaddd5d4b9c992a934c09d528dbbf5c6f0"
    arm64.url = "https://github.com/libredb/libredb-studio/releases/download/0.17.0/libredb-studio-standalone-0.17.0-linux-arm64.tar.gz"
    arm64.sha256 = "3fd5d51cfd0a6b3c114b2cfd47b3f8f2b9f0d11062ede218002d593c202ff3cb"

    # Anchored: 28 assets are published and several share this prefix.
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^libredb-studio-standalone-.*-linux-x64\\.tar\\.gz$"
    autoupdate.asset.arm64 = "^libredb-studio-standalone-.*-linux-arm64\\.tar\\.gz$"

    [resources.system_user]

    [resources.install_dir]

    # An upgrade replaces install_dir wholesale; the store lives here instead.
    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.nodejs]
    version = "24"
    