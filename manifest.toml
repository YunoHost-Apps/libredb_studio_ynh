#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "libredb_studio"
name = "LibreDB Studio"
description.en = "Web SQL client for 41 database engines, with schema browser, ER diagrams and query editor"

version = "0.18.3~ynh1"

maintainers = ["yusuf-gundogdu"]

[upstream]
license = "MIT"
website = "https://libredb.org"
demo = "https://app.libredb.org"
admindoc = "https://libredb.org/helper/"
code = "https://github.com/libredb/libredb-studio"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

ldap = false
sso = false

# Measured on 12.1.41: 292 MB unpacked, 407 MB for the Node tree, 94 MB RSS.
disk = "800M"
ram.build = "50M"
ram.runtime = "250M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    help.en = "LibreDB Studio has its own login system, so YunoHost's SSO can be left off. The first run generates an administrator password and prints it once to the service log."
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/libredb/libredb-studio/releases/download/0.18.3/libredb-studio-standalone-0.18.3-linux-x64.tar.gz"
    amd64.sha256 = "15656d7753e53ce8e324b77339b590040de61e710e9953e19bebd800b7f7c8dd"
    arm64.url = "https://github.com/libredb/libredb-studio/releases/download/0.18.3/libredb-studio-standalone-0.18.3-linux-arm64.tar.gz"
    arm64.sha256 = "f4685bf96b40f81a895975bf6b64c78d68d0ca996f0ad3b57733ee07a3176e96"

    # Anchored: 28 assets are published and several share this prefix.
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^libredb-studio-standalone-.*-linux-x64\\.tar\\.gz$"
    autoupdate.asset.arm64 = "^libredb-studio-standalone-.*-linux-arm64\\.tar\\.gz$"

    [resources.system_user]

    [resources.install_dir]

    # An upgrade replaces install_dir wholesale; the store lives here instead.
    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.nodejs]
    version = "24"
    