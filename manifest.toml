#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "libredb_studio"
name = "LibreDB Studio"
description.en = "Web SQL client for 16 database engines, with schema browser, ER diagrams and query editor"

version = "0.16.1~ynh1"

maintainers = ["yusuf-gundogdu"]

[upstream]
license = "MIT"
website = "https://libredb.org"
demo = "https://trial.libredb.org"
admindoc = "https://libredb.org/helper/"
code = "https://github.com/libredb/libredb-studio"

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

# The application has its own account system, with local password login, OIDC
# and per-account TOTP. It does not read an LDAP directory and it does not
# consume the SSO headers, so declaring either would promise something the
# build cannot do.
ldap = false
sso = false

# Disk: the payload unpacks to 303 MB (measured on the 0.16.1 linux-x64 archive)
# and `n` adds a Node 24 runtime on top of that. Nothing is compiled at install
# time, so the build figure is just the unpack. The runtime figure is still a
# placeholder and has to be corrected against what the CI reports.
disk = "500M"
ram.build = "50M"
ram.runtime = "400M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    help.en = "LibreDB Studio has its own login system, so YunoHost's SSO can be left off. The first run generates an administrator password and prints it once to the service log."
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/libredb/libredb-studio/releases/download/0.16.1/libredb-studio-standalone-0.16.1-linux-x64.tar.gz"
    amd64.sha256 = "4ce16ce3071dbd2244f380474e3b0c76358086bf0cb05fe894129c7014cff2a7"
    arm64.url = "https://github.com/libredb/libredb-studio/releases/download/0.16.1/libredb-studio-standalone-0.16.1-linux-arm64.tar.gz"
    arm64.sha256 = "b7ee625001d1949a62ff695e29b4e6d20b12a9c9565fd6d549eb26923fb1123d"

    # Anchored at both ends deliberately. The release publishes 28 assets and
    # several share this prefix; an unanchored pattern would start matching a
    # sibling the day one is added next to the archive. Checked against the
    # 0.16.1 asset list: one match each.
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^libredb-studio-standalone-.*-linux-x64\\.tar\\.gz$"
    autoupdate.asset.arm64 = "^libredb-studio-standalone-.*-linux-arm64\\.tar\\.gz$"

    [resources.system_user]

    [resources.install_dir]

    # The SQLite store, the sample databases and the generated credentials live
    # here rather than in install_dir, because an upgrade replaces install_dir
    # wholesale. The application derives this directory from the dirname of
    # STORAGE_SQLITE_PATH, which conf/env sets to an absolute path under it.
    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
