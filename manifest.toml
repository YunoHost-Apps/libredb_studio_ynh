#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "libredb_studio"
name = "LibreDB Studio"
description.en = "Web SQL client for 18 database engines, with schema browser, ER diagrams and query editor"

version = "1.1.0~ynh1"

maintainers = ["yusuf-gundogdu"]

[upstream]
license = "MIT"
website = "https://libredb.org"
demo = "https://app.libredb.org"
admindoc = "https://libredb.org/helper/"
code = "https://github.com/libredb/libredb-studio"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

ldap = false
sso = false

# Measured on 12.1.41: 292 MB unpacked, 407 MB for the Node tree, 94 MB RSS.
disk = "800M"
ram.build = "50M"
ram.runtime = "250M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    help.en = "LibreDB Studio has its own login system, so YunoHost's SSO can be left off. The first run generates an administrator password and prints it once to the service log."
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/libredb/libredb-studio/releases/download/1.1.0/libredb-studio-standalone-1.1.0-linux-x64.tar.gz"
    amd64.sha256 = "7334d32062d1762e46d472bb162f4fde612963f0b3a3bbb5e27cdbed32ba8a07"
    arm64.url = "https://github.com/libredb/libredb-studio/releases/download/1.1.0/libredb-studio-standalone-1.1.0-linux-arm64.tar.gz"
    arm64.sha256 = "5b293d65748002ddcad380c09df684c229f039f1c6b04587de8bad8e4b8f1b2f"

    # Anchored: 28 assets are published and several share this prefix.
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^libredb-studio-standalone-.*-linux-x64\\.tar\\.gz$"
    autoupdate.asset.arm64 = "^libredb-studio-standalone-.*-linux-arm64\\.tar\\.gz$"

    [resources.system_user]

    [resources.install_dir]

    # An upgrade replaces install_dir wholesale; the store lives here instead.
    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.nodejs]
    version = "24"
    